name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('pyproject.toml') != ''
      - run: uv sync
        if: hashFiles('pyproject.toml') != ''
      # action-setup fails with no pnpm version, and also when given one
      # beside package.json's packageManager; pass one only when that is absent
      - id: pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        run: grep -q '"packageManager"' package.json || echo "version=10" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      # The broker the tests run against. The packages come from a cache
      # keyed on the runner image, and a hit makes no network request.
      - name: cache key, from the runner image
        id: image
        run: echo "key=mosquitto-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: mosquitto packages, restored
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/mosquitto-debs/*.deb
          key: ${{ steps.image.outputs.key }}
      - name: mosquitto
        id: mosquitto
        timeout-minutes: 5
        env:
          HIT: ${{ steps.debs.outputs.cache-hit }}
        run: |
          if [ "$HIT" != true ]; then
            mkdir -p ~/mosquitto-debs/partial
            sudo apt-get update
            sudo apt-get install -y --download-only -o Dir::Cache::archives="$HOME/mosquitto-debs" mosquitto
          fi
          sudo dpkg -i ~/mosquitto-debs/*.deb
      - name: mosquitto packages, saved
        if: steps.debs.outputs.cache-hit != 'true' && steps.mosquitto.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/mosquitto-debs/*.deb
          key: ${{ steps.image.outputs.key }}
      - name: gate
        run: |
          cmd=$(sed -n 's/^ci:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || cmd=$(sed -n 's/^[Gg]ate:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || { [ -x scripts/check.sh ] && cmd=./scripts/check.sh; }
          [ -n "$cmd" ] || { grep -qE '^check:' Makefile 2>/dev/null && cmd="make check"; }
          [ -n "$cmd" ] || { node -e 'process.exit(require("./package.json").scripts?.check ? 0 : 1)' 2>/dev/null && cmd="npm run check"; }
          [ -n "$cmd" ] || { echo "no ci:/gate: line in CLAUDE.md, no scripts/check.sh, no make check, no npm check script"; exit 1; }
          echo "+ $cmd"
          bash -c "$cmd"

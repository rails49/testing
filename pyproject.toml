[project]
name = "rails49-testing"
version = "0.1.0"
description = "Test helpers for the rails49 repositories: ports, a real mosquitto, and a subscriber"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1",
  "pytest>=8.3",
]

[dependency-groups]
dev = [
  "black>=25.1",
  "pyright>=1.1.400",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rails49_testing"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
